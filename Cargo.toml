[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.15.3", features = ["dynamic_linking", "jpeg", "meshlet", "meshlet_processor" ,"file_watcher"] }
bevy_asset_loader = "0.22.0"
bevy_atmosphere = "0.12.2"
bevy_egui = "0.33.0"
bevy_hanabi = {git = "https://github.com/djeedai/bevy_hanabi"}
bevy_obj = "0.15.1"
bevy_rapier3d = "0.29.0"
bevy_tweening = "0.12.0"
bevy_water = "0.15.2"
bitflags = "2.9.0"
bytemuck = "1.22.0"
delaunator = "1.0.2"
earcutr = "0.4.3"
eyre = "0.6.12"
fast_poisson = "1.0.0"
image = "0.25.6"
itertools = "0.14.0"
iyes_perf_ui = "0.4.0"
noise = { version = "0.8.0", features = ["images"] }
ordered-float = "5.0.0"
pathfinding = "4.14.0"
rand = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
slotmap = "1.0.7"
smol = "2.0.2"
smooth-bevy-cameras = "0.13.0"
spade = "2.13.1"
thiserror = "2.0.12"
voronoice = "0.2.0"

[profile.dev.package."*"]
opt-level = 3
