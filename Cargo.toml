[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.15.3", features = ["dynamic_linking", "meshlet"] }
delaunator = "1.0.2"
earcutr = "0.4.3"
eyre = "0.6.12"
fast_poisson = "1.0.0"
iyes_perf_ui = "0.4.0"
noise = { version = "0.8.0", features = ["images"] }
rand = "0.9.0"
smooth-bevy-cameras = "0.13.0"
spade = "2.13.1"
voronoice = "0.2.0"

[profile.dev.package."*"]
opt-level = 3
